services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: efp
      POSTGRES_USER: efp
      POSTGRES_PASSWORD: efp-dev-password
    ports:
      - "5432:5432"
    volumes:
      - efp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efp -d efp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/Api
    environment:
      ConnectionStrings__Efp: Host=db;Port=5432;Database=efp;Username=efp;Password=efp-dev-password
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  efp-postgres:
