name: Local LLM issue to draft PR

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/local-llm-issue.yml
      - .github/scripts/local_llm_issue.py
      - .github/scripts/test_local_llm_issue.py

permissions: {}
concurrency:
  group: local-llm-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 .github/scripts/local_llm_issue.py smoke
        env:
          LLM_URL: https://llm.omny.se
          LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen3:8b' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  implement:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      ((github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner) ||
       (github.event.action == 'labeled' && github.event.label.name == 'ai-approved'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      run: ${{ steps.authorize.outputs.run }}
    env:
      LLM_URL: https://llm.omny.se
      LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen3:8b' }}
      AGENT_STATE: ${{ runner.temp }}/efp-agent-state
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Copy trusted agent outside editable workspace
        run: |
          cp .github/scripts/local_llm_issue.py "$RUNNER_TEMP/efp-agent.py"
          python3 -m unittest discover -s .github/scripts -p 'test_local_llm_issue.py'
      - name: Authorize event and check connection
        id: authorize
        run: python3 "$RUNNER_TEMP/efp-agent.py" authorize
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: steps.authorize.outputs.run == 'true'
        with:
          dotnet-version: '9.0.x'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.authorize.outputs.run == 'true'
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.authorize.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install project dependencies and verify baseline
        if: steps.authorize.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          dotnet restore tests/Api.UnitTests/Api.UnitTests.csproj
          dotnet restore tests/Api.ContractTests/Api.ContractTests.csproj
          python3 "$RUNNER_TEMP/efp-agent.py" verify baseline
      - name: Refine issue and select relevant files
        if: steps.authorize.outputs.run == 'true'
        run: python3 "$RUNNER_TEMP/efp-agent.py" refine
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: Write regression test first
        if: steps.authorize.outputs.run == 'true'
        run: python3 "$RUNNER_TEMP/efp-agent.py" tests
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: Verify red phase for bugs
        if: steps.authorize.outputs.run == 'true'
        run: python3 "$RUNNER_TEMP/efp-agent.py" verify red
      - name: Implement solution
        if: steps.authorize.outputs.run == 'true'
        run: python3 "$RUNNER_TEMP/efp-agent.py" implement
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: Verify solution
        if: steps.authorize.outputs.run == 'true'
        run: python3 "$RUNNER_TEMP/efp-agent.py" verify green
      - name: Export validated changes
        if: steps.authorize.outputs.run == 'true'
        run: python3 "$RUNNER_TEMP/efp-agent.py" export
      - name: Transfer validated result
        if: steps.authorize.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-agent-result
          path: ${{ runner.temp }}/efp-agent-state/*.json
          retention-days: 1
      - name: Report failed run on issue
        if: failure()
        run: python3 "$RUNNER_TEMP/efp-agent.py" failure
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: implement
    if: needs.implement.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      AGENT_STATE: ${{ runner.temp }}/efp-agent-state
      LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen3:8b' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-agent-result
          path: ${{ runner.temp }}/efp-agent-state
      - name: Open draft PR from fresh trusted runner
        run: python3 .github/scripts/local_llm_issue.py publish
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report publication failure
        if: failure()
        run: python3 .github/scripts/local_llm_issue.py failure
        env:
          GH_TOKEN: ${{ github.token }}
